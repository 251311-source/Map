<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시간여행자 지도</title>

  <style>
    /* 기본 여백 제거 및 박스 크기 계산 방식 통일 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 모드별 색상을 변수로 관리 (현재 모드 기본값) */
    :root {
      --accent: #3b82f6;
      --accent-dark: #2563eb;
      --accent-light: #f5f8ff;
      --sidebar-bg: #ffffff;
    }

    /* 과거 모드일 때 색상 변수만 바꿔서 전체 분위기 전환 */
    body.past-mode {
      --accent: #a16207;
      --accent-dark: #854d0e;
      --accent-light: #fdf6e3;
      --sidebar-bg: #fffaf0;
    }

    html,
    body {
      height: 100%;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #222;
    }

    /* 전체 화면을 좌우 2분할 */
    .container {
      display: flex;
      height: 100vh;
    }

    /* 왼쪽 영역 */
    .sidebar {
      width: 360px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      background: var(--sidebar-bg);
      transition: background 0.5s;
    }

    .app-title {
      padding: 16px 16px 8px;
      font-size: 20px;
      color: var(--accent);
      transition: color 0.5s;
    }

    /* 과거 / 현재 전환 탭 */
    .time-tabs {
      display: flex;
      margin: 0 16px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      overflow: hidden;
    }

    .time-tab {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }

    /* 선택된 탭은 색을 채워서 강조 */
    .time-tab.active {
      background: var(--accent);
      color: #fff;
    }

    .mode-description {
      padding: 10px 16px 0;
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    .search-form {
      display: flex;
      gap: 8px;
      padding: 12px 16px 16px;
      border-bottom: 1px solid #eee;
    }

    .search-form input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .search-form input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-form button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .search-form button:hover {
      background: var(--accent-dark);
    }

    /* 결과 리스트 */
    .result-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .result-item {
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }

    .result-item:hover {
      background: var(--accent-light);
    }

    .place-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .place-address,
    .place-detail {
      font-size: 13px;
      color: #666;
    }

    .message {
      padding: 16px;
      font-size: 14px;
      color: #888;
    }

    /* 오른쪽 지도 */
    #map {
      flex: 1;
      transition: filter 0.8s; /* 모드 전환 시 부드럽게 색 변화 */
    }

    /* 과거 모드: 지도를 오래된 사진 느낌(세피아)으로 */
    body.past-mode #map {
      filter: sepia(0.85) contrast(0.95) brightness(0.95);
    }

    /* 모바일에서는 위아래 배치 */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 50vh;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }

      #map {
        height: 50vh;
      }
    }
  </style>

  <!-- 카카오 지도 SDK (services: 장소 검색 / autoload=false: 로딩 순서 직접 제어) -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=739a6999d649b317a921d5661b8df36f&libraries=services&autoload=false"></script>
</head>

<body class="past-mode">
  <div class="container">
    <!-- 왼쪽: 모드 탭 + 검색창 + 결과 리스트 -->
    <aside class="sidebar">
      <h1 class="app-title">시간여행자 지도</h1>

      <div class="time-tabs">
        <button class="time-tab active" data-mode="past">과거 · 문화유산</button>
        <button class="time-tab" data-mode="present">현재 · 대형쇼핑</button>
      </div>
      <p id="modeDescription" class="mode-description"></p>

      <form id="searchForm" class="search-form">
        <input id="keywordInput" type="text" placeholder="장소를 직접 검색할 수도 있어요" />
        <button type="submit">검색</button>
      </form>

      <ul id="resultList" class="result-list">
        <li class="message">지도를 불러오는 중입니다...</li>
      </ul>
    </aside>

    <!-- 오른쪽: 지도 -->
    <div id="map"></div>
  </div>

  <script>
    // ===== 설정값 =====
    const MAP_LEVEL = 5;                                      // 지도 확대 레벨
    const SEARCH_RADIUS = 5000;                               // 자동 검색 반경 (미터, 최대 20000)
    const DEFAULT_POSITION = { lat: 37.5665, lng: 126.978 };  // 위치 권한이 없을 때 기본 위치 (서울시청)

    // 모드별 설정 (keyword를 바꾸면 다른 주제로도 쉽게 변경 가능)
    const TIME_MODES = {
      past: {
        keyword: "문화유산",
        description: "과거로 떠나는 여행: 내 주변에 남아 있는 옛 시간의 흔적, 문화유산을 찾아봅니다.",
      },
      present: {
        keyword: "쇼핑몰",
        description: "현재로 돌아오기: 같은 동네가 지금은 어떤 모습인지, 대형 쇼핑 공간을 찾아봅니다.",
      },
    };

    // ===== 전역 변수 =====
    let map = null;
    let placesService = null;
    let infoWindow = null;
    let placeMarkers = [];
    let currentMode = "past";      // 처음에는 과거 모드로 시작
    let userPosition = null;       // 사용자의 현재 위치 (검색 기준점)

    const searchForm = document.getElementById("searchForm");
    const keywordInput = document.getElementById("keywordInput");
    const resultList = document.getElementById("resultList");
    const modeDescription = document.getElementById("modeDescription");
    const timeTabs = document.querySelectorAll(".time-tab");

    // ===== SDK 로딩 확인 후 지도 실행 =====
    if (typeof kakao === "undefined") {
      showMessage("지도를 불러오지 못했습니다. 앱 키와 도메인 등록을 확인해 주세요.");
    } else {
      kakao.maps.load(initMap);
    }

    // ===== 지도 초기화 =====
    function initMap() {
      const mapContainer = document.getElementById("map");
      userPosition = new kakao.maps.LatLng(DEFAULT_POSITION.lat, DEFAULT_POSITION.lng);

      map = new kakao.maps.Map(mapContainer, {
        center: userPosition,
        level: MAP_LEVEL,
      });

      placesService = new kakao.maps.services.Places();
      infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

      // 과거 / 현재 탭 클릭 이벤트
      timeTabs.forEach(function (tab) {
        tab.addEventListener("click", function () {
          changeMode(tab.dataset.mode);
        });
      });

      // 직접 검색 (버튼 클릭 또는 엔터)
      searchForm.addEventListener("submit", function (event) {
        event.preventDefault();
        const keyword = keywordInput.value.trim();

        if (keyword === "") {
          showMessage("검색어를 입력해 주세요.");
          return;
        }
        searchPlaces(keyword, map.getCenter());
      });

      updateModeDescription();
      moveToCurrentLocation();
    }

    // ===== 과거 / 현재 모드 전환 =====
    function changeMode(newMode) {
      if (newMode === currentMode) return; // 이미 선택된 모드면 무시

      currentMode = newMode;

      // body 클래스를 바꿔서 색상·지도 필터 전환
      document.body.classList.toggle("past-mode", currentMode === "past");

      // 탭 강조 표시 변경
      timeTabs.forEach(function (tab) {
        tab.classList.toggle("active", tab.dataset.mode === currentMode);
      });

      updateModeDescription();
      keywordInput.value = "";
      searchByMode();
    }

    // ===== 모드 설명 문구 갱신 =====
    function updateModeDescription() {
      modeDescription.textContent = TIME_MODES[currentMode].description;
    }

    // ===== 현재 모드의 키워드로 주변 자동 검색 =====
    function searchByMode() {
      const keyword = TIME_MODES[currentMode].keyword;
      searchPlaces(keyword, userPosition, SEARCH_RADIUS);
    }

    // ===== 현재 위치로 지도 이동 =====
    function moveToCurrentLocation() {
      if (!navigator.geolocation) {
        showMessage("이 브라우저는 위치 정보를 지원하지 않아 기본 위치로 표시합니다.");
        searchByMode();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        // 위치 허용 성공
        function (position) {
          userPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );
          map.setCenter(userPosition);

          // 현재 위치 마커 (검색 마커와 달리 지우지 않음)
          new kakao.maps.Marker({ map: map, position: userPosition });

          searchByMode();
        },
        // 위치 거부 또는 실패 → 기본 위치 기준으로 검색
        function () {
          searchByMode();
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // ===== 장소 검색 (기준 위치와 반경은 선택) =====
    function searchPlaces(keyword, centerPosition, radius) {
      const searchOptions = {
        location: centerPosition,
        sort: kakao.maps.services.SortBy.DISTANCE, // 가까운 순서
      };

      if (radius) {
        searchOptions.radius = radius;
      }

      placesService.keywordSearch(keyword, handleSearchResult, searchOptions);
    }

    // ===== 검색 결과 처리 =====
    function handleSearchResult(places, status) {
      if (status === kakao.maps.services.Status.OK) {
        displayPlaces(places);
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        clearMarkers();
        showMessage("주변에서 검색 결과를 찾지 못했습니다.");
      } else {
        clearMarkers();
        showMessage("검색 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
      }
    }

    // ===== 결과를 리스트와 지도에 표시 =====
    function displayPlaces(places) {
      clearMarkers();
      resultList.innerHTML = "";

      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place) {
        const placePosition = new kakao.maps.LatLng(place.y, place.x);

        const marker = new kakao.maps.Marker({
          map: map,
          position: placePosition,
        });
        placeMarkers.push(marker);
        bounds.extend(placePosition);

        // 리스트 항목 만들기
        const listItem = document.createElement("li");
        listItem.className = "result-item";

        const nameElement = document.createElement("div");
        nameElement.className = "place-name";
        nameElement.textContent = place.place_name;

        const addressElement = document.createElement("div");
        addressElement.className = "place-address";
        addressElement.textContent = place.road_address_name || place.address_name;

        // 분류와 거리 표시 (예: 관광명소 · 850m)
        const detailElement = document.createElement("div");
        detailElement.className = "place-detail";
        const categoryName = place.category_name.split(" > ").pop();
        detailElement.textContent = place.distance
          ? categoryName + " · " + formatDistance(place.distance)
          : categoryName;

        listItem.appendChild(nameElement);
        listItem.appendChild(addressElement);
        listItem.appendChild(detailElement);

        listItem.addEventListener("click", function () {
          showPlaceInfo(place, marker);
        });
        kakao.maps.event.addListener(marker, "click", function () {
          showPlaceInfo(place, marker);
        });

        resultList.appendChild(listItem);
      });

      map.setBounds(bounds);
    }

    // ===== 거리 표시 형식 (1000m 이상은 km로) =====
    function formatDistance(distanceText) {
      const meters = Number(distanceText);
      return meters >= 1000 ? (meters / 1000).toFixed(1) + "km" : meters + "m";
    }

    // ===== 마커 위에 장소 이름 표시 + 지도 이동 =====
    function showPlaceInfo(place, marker) {
      const infoContent = document.createElement("div");
      infoContent.style.padding = "6px 10px";
      infoContent.style.fontSize = "13px";
      infoContent.textContent = place.place_name;

      infoWindow.setContent(infoContent);
      infoWindow.open(map, marker);
      map.panTo(marker.getPosition());
    }

    // ===== 기존 검색 마커 모두 지우기 =====
    function clearMarkers() {
      placeMarkers.forEach(function (marker) {
        marker.setMap(null);
      });
      placeMarkers = [];
      infoWindow.close();
    }

    // ===== 왼쪽 리스트에 안내 메시지 표시 =====
    function showMessage(text) {
      resultList.innerHTML = "";
      const messageItem = document.createElement("li");
      messageItem.className = "message";
      messageItem.textContent = text;
      resultList.appendChild(messageItem);
    }
  </script>
</body>
</html>
