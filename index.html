<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시간여행자 지도</title>

  <style>
    /* ===== 기본 설정 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 모드별 색상 변수 (현재 모드 기본값) */
    :root {
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --accent-light: #eff6ff;
      --sidebar-bg: #ffffff;
      --my-location: #ef4444;
    }

    /* 과거 모드일 때 색상 변수만 교체 */
    body.past-mode {
      --accent: #a16207;
      --accent-dark: #854d0e;
      --accent-light: #fdf6e3;
      --sidebar-bg: #fffaf0;
    }

    html,
    body {
      height: 100%;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #222;
    }

    /* ===== 전체 레이아웃: 좌우 2분할 ===== */
    .container {
      display: flex;
      height: 100vh;
    }

    /* ===== 왼쪽 사이드바 ===== */
    .sidebar {
      width: 360px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      background: var(--sidebar-bg);
      transition: background 0.5s;
    }

    .app-title {
      padding: 18px 16px 10px;
      font-size: 21px;
      color: var(--accent);
      transition: color 0.5s;
    }

    /* 과거 / 현재 전환 탭 */
    .time-tabs {
      display: flex;
      margin: 0 16px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      overflow: hidden;
    }

    .time-tab {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }

    .time-tab.active {
      background: var(--accent);
      color: #fff;
    }

    .mode-description {
      padding: 10px 16px 0;
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    /* 검색창 */
    .search-form {
      display: flex;
      gap: 8px;
      padding: 12px 16px 16px;
      border-bottom: 1px solid #eee;
    }

    .search-form input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .search-form input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-form button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .search-form button:hover {
      background: var(--accent-dark);
    }

    /* 검색 기준 요약 (내용이 없으면 숨김) */
    .result-summary {
      padding: 10px 16px;
      border-bottom: 1px solid #eee;
      background: var(--accent-light);
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 600;
    }

    .result-summary:empty {
      display: none;
    }

    /* 결과 리스트 */
    .result-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .result-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      border-left: 4px solid transparent;
      cursor: pointer;
      transition: background 0.2s;
    }

    .result-item:hover {
      background: var(--accent-light);
    }

    .result-item.selected {
      background: var(--accent-light);
      border-left-color: var(--accent);
    }

    .result-icon {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    .place-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .place-address,
    .place-detail {
      font-size: 13px;
      color: #666;
    }

    .message {
      padding: 16px;
      font-size: 14px;
      color: #888;
      line-height: 1.5;
    }

    /* ===== 오른쪽 지도 영역 ===== */
    .map-wrapper {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 지도 바탕(타일 이미지)에만 세피아 필터 → 마커와 팝업은 원래 색 유지 */
    #map img {
      transition: filter 0.8s;
    }

    body.past-mode #map img {
      filter: sepia(0.85) contrast(0.95) brightness(0.95);
    }

    /* 지도 위 모드 배지 */
    .mode-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      transition: background 0.5s;
    }

    /* "이 지역에서 다시 찾기" 버튼: 평소엔 숨어 있다가 지도를 움직이면 내려옴 */
    .research-button {
      position: absolute;
      top: 16px;
      left: 50%;
      z-index: 11;
      padding: 9px 18px;
      border: 2px solid var(--accent);
      border-radius: 999px;
      background: #fff;
      color: var(--accent-dark);
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      opacity: 0;
      pointer-events: none; /* 숨어 있을 때는 클릭 안 되게 */
      transform: translate(-50%, -12px);
      transition: opacity 0.25s, transform 0.25s;
    }

    .research-button.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }

    .research-button:hover {
      background: var(--accent-light);
    }

    /* 내 위치로 이동 버튼 */
    .locate-button {
      position: absolute;
      right: 16px;
      bottom: 24px;
      z-index: 10;
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      background: #fff;
      color: var(--my-location);
      font-size: 22px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }

    .locate-button:hover {
      background: #fef2f2;
    }

    /* ===== 장소 마커 (물방울 모양 핀) ===== */
    .place-pin {
      position: relative;
      top: -8px; /* 회전 오차 보정: 핀 끝이 정확한 위치를 가리키게 함 */
      width: 38px;
      height: 38px;
      border: 2px solid #fff;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .place-pin.past {
      background: #a16207;
    }

    .place-pin.present {
      background: #2563eb;
    }

    .place-pin:hover {
      transform: rotate(-45deg) scale(1.12);
    }

    .place-pin.selected {
      transform: rotate(-45deg) scale(1.3);
    }

    .pin-icon {
      transform: rotate(45deg);
      font-size: 18px;
    }

    /* ===== 내 위치 표시 ===== */
    .my-location {
      position: relative;
      width: 18px;
      height: 18px;
    }

    .my-location-dot {
      position: relative;
      z-index: 1;
      width: 18px;
      height: 18px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: var(--my-location);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }

    .my-location-pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.4);
      animation: pulse 2s ease-out infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }
      100% {
        transform: scale(3.5);
        opacity: 0;
      }
    }

    .my-location-label {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--my-location);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
    }

    /* ===== 상세 팝업 (말풍선 카드) ===== */
    .detail-popup {
      position: relative;
      bottom: 56px;
      width: 260px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      font-size: 13px;
      cursor: default;
    }

    .detail-popup::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #fff transparent transparent;
    }

    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: 12px 12px 0 0;
      background: var(--accent);
      color: #fff;
    }

    .popup-category {
      font-size: 12px;
      font-weight: 600;
    }

    .popup-close {
      border: none;
      background: none;
      color: #fff;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .popup-body {
      padding: 12px 14px 14px;
    }

    .popup-name {
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 700;
    }

    .popup-row {
      margin-bottom: 4px;
      color: #555;
      line-height: 1.4;
    }

    .popup-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .popup-actions a {
      flex: 1;
      padding: 8px 0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    .popup-link-detail {
      border: 1px solid var(--accent);
      background: var(--accent-light);
      color: var(--accent-dark);
    }

    .popup-link-route {
      background: var(--accent);
      color: #fff;
    }

    /* ===== 모바일: 위아래 배치 ===== */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 50vh;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }

      .map-wrapper {
        height: 50vh;
      }

      /* 좁은 화면에서는 배지와 겹치지 않게 버튼을 아래로 */
      .research-button {
        top: 60px;
      }
    }
  </style>

  <!-- 카카오 지도 SDK (services: 장소 검색 / autoload=false: 로딩 순서 직접 제어) -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=739a6999d649b317a921d5661b8df36f&libraries=services&autoload=false"></script>
</head>

  <div class="container">
    <!-- 왼쪽: 모드 탭 + 검색창 + 결과 리스트 -->
    <aside class="sidebar">
      <h1 class="app-title">⏳ 시간여행자
