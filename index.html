<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>야간 안심 귀가 지도 🌙</title>
  
  <style>
    /* ===== [CSS] 기본 스타일 및 밤길 다크 테마 ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #121826;
      color: #ffffff;
    }

    /* 좌/우 2분할 레이아웃 */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* ===== [CSS] 왼쪽 사이드바 ===== */
    .sidebar {
      width: 380px;
      height: 100%;
      background-color: #1a2234;
      border-right: 1px solid #2e3a52;
      display: flex;
      flex-direction: column;
      z-index: 2;
      box-shadow: 4px 0 15px rgba(0, 0, 0, 0.4);
    }

    /* 헤더 영역 */
    .header-box {
      padding: 20px 15px 10px;
      background-color: #121826;
      border-bottom: 1px solid #2e3a52;
    }

    .header-title {
      font-size: 18px;
      font-weight: bold;
      color: #ffe600; /* 빛나는 노란색 */
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* 탭 버튼 영역 */
    .tab-container {
      display: flex;
      background-color: #121826;
      padding: 10px 15px;
      gap: 10px;
      border-bottom: 1px solid #2e3a52;
    }

    .tab-button {
      flex: 1;
      padding: 10px;
      border: 1px solid #2e3a52;
      border-radius: 8px;
      background-color: #1a2234;
      color: #94a3b8;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* 탭 1 (편의점) 활성화 */
    .tab-button.convenience.active {
      background-color: #0d3b66;
      color: #60a5fa;
      border-color: #3b82f6;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }
